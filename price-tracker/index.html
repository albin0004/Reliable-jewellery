<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- Firebase Config & Auth Shield Middleware -->
  <script src="../firebase-config.js"></script>
  <script src="../auth-shield.js"></script>
  <script src="../security-utils.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Price Tracker | Reliable Jewellery</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M3 3h18v18H3V3zm2 2v4h6V5H5zm8 0v4h6V5h-6zM5 11v4h6v-4H5zm8 0v4h6v-4h-6zM5 17v2h6v-2H5zm8 0v2h6v-2h-6z'/></svg>" />
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0F172A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- TOP ACTION BAR -->
  <header class="top-action-bar">
    
    <!-- Brand & Seamless Live Status Indicator with Suite Back Navigation -->
    <div class="brand-group">
      <a href="../index.html" class="back-suite-btn" title="Back to Reliable Suite">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>SUITE</span>
      </a>

      <h1 class="brand-title">
        PRICE TRACKER
      </h1>

      <div id="liveIndicator" title="DATABASE CONNECTED" class="live-indicator-badge">
        <span id="liveDot" class="live-dot"></span>
        <span id="liveText" class="live-text">LIVE</span>
      </div>
    </div>

    <!-- Search Input -->
    <div class="search-wrapper">
      <input 
        id="searchInput"
        type="text" 
        placeholder="SEARCH ITEMS, TOOLS, CODES, PRICES..." 
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <!-- Controls & Actions -->
    <div class="controls-group">
      
      <!-- ON-SCREEN "+/-" ZOOM CONTROL -->
      <div class="zoom-controls">
        <button id="zoomOutBtn" title="ZOOM OUT (-10%)" type="button" class="zoom-btn">−</button>
        <button id="zoomResetBtn" title="CLICK TO RESET (100%)" type="button" class="zoom-display-btn">
          <span id="zoomDisplay">100%</span>
        </button>
        <button id="zoomInBtn" title="ZOOM IN (+10%)" type="button" class="zoom-btn">+</button>
      </div>

      <!-- Add Column Button -->
      <button id="addColumnBtn" title="ADD NEW DETAIL COLUMN" type="button" class="btn btn-outline">
        + COLUMN
      </button>

      <!-- Add Row Button -->
      <button id="addRowBtn" type="button" class="btn btn-primary">
        + ADD ROW
      </button>

      <!-- Export Button -->
      <button id="exportBtn" title="EXPORT SPREADSHEET TO CSV" type="button" class="btn btn-outline">
        EXPORT
      </button>

      <!-- Clear Button -->
      <button id="clearBtn" title="CLEAR SPREADSHEET DATA" type="button" class="btn btn-danger">
        CLEAR
      </button>

    </div>
  </header>

  <!-- MAIN SPREADSHEET CONTAINER WITH ON-SCREEN ZOOM SCALING -->
  <main id="mainGridArea">
    
    <!-- FLUID HORIZONTAL AND VERTICAL SCROLLING CONTAINER (overflow-x: auto, overflow-y: auto) -->
    <div id="scrollContainer">
      
      <!-- MOBILE PULL TO REFRESH INDICATOR -->
      <div id="pullToRefresh" class="pull-to-refresh-container">
        <div class="ptr-content">
          <span class="ptr-icon" id="ptrIcon">↓</span>
          <span class="ptr-spinner" id="ptrSpinner"></span>
          <span id="ptrText">PULL TO REFRESH</span>
        </div>
      </div>

      <!-- STRETCH WRAPPER: Stretches to fit desktop screen and expands with max-content -->
      <div id="gridWrapper">
        
        <!-- COLUMN HEADERS BAR -->
        <div id="headerBar">
          
          <!-- First Column Header: Specifications -->
          <div class="col-item" style="border-right: 2px solid #334155; background: #020617; padding: 10px 12px; font-size: 14px; font-weight: 600; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between;">
            <span>SPECIFICATIONS</span>
          </div>

          <!-- Detail Columns Header Container -->
          <div id="detailHeadersContainer" style="flex: 1 0 auto; display: flex; min-width: max-content; background-color: #0F172A;">
            <!-- Rendered dynamically -->
          </div>

        </div>

        <!-- SPREADSHEET ROWS CONTAINER -->
        <div id="rowsContainer">
          <!-- Rendered dynamically -->
        </div>

        <!-- BOTTOM ADD ROW BAR -->
        <div style="padding: 16px; background: #F8FAFC; border-top: 1px solid #CBD5E1; display: flex; justify-content: center; width: 100%; min-width: 100%;">
          <button id="bottomAddRowBtn" class="btn-bottom-add" type="button">
            <span style="color: #059669; font-size: 18px; line-height: 1;">+</span>
            <span>ADD NEW ITEM ROW</span>
          </button>
        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER STATUS -->
  <footer style="background: #0F172A; color: #94A3B8; font-size: 12px; font-weight: 500; padding: 6px 16px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #1E293B; flex-shrink: 0; z-index: 30;">
    <div style="display: flex; gap: 16px;">
      <span>TOTAL ROWS: <strong id="totalRowsCount" style="color: #FFFFFF;">0</strong></span>
      <span>COLUMNS: <strong id="totalColsCount" style="color: #FFFFFF;">0</strong></span>
      <span id="filterStatus" style="display: none; color: #F59E0B;"></span>
    </div>
  </footer>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer"></div>

  <!-- CLEAR CONFIRMATION MODAL -->
  <div id="clearModal" class="modal-backdrop">
    <div class="modal-card">
      <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #000000;">
        CONFIRM CLEAR SPREADSHEET
      </h3>
      <p style="font-size: 13px; color: #475569; margin-bottom: 20px; line-height: 1.5;">
        SELECT CLEARING OPTION FOR YOUR SPREADSHEET (REQUIRES ADMINISTRATIVE PIN):
      </p>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
        <button id="modalClearAll" type="button" style="padding: 12px; text-align: left; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 4px; font-size: 13px; font-weight: 600; color: #DC2626; cursor: pointer;">
          1. CLEAR ALL ROWS (START COMPLETELY FRESH)
        </button>
        <button id="modalResetTemplate" type="button" style="padding: 12px; text-align: left; background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 4px; font-size: 13px; font-weight: 600; color: #059669; cursor: pointer;">
          2. RESET TO DEFAULT SAMPLE TEMPLATE
        </button>
      </div>
      <div style="display: flex; justify-content: flex-end;">
        <button id="modalCancelClear" type="button" style="padding: 8px 16px; background: #F1F5F9; border: 1px solid #CBD5E1; border-radius: 4px; font-size: 13px; font-weight: 500; color: #334155; cursor: pointer;">
          CANCEL
        </button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT APPLICATION CODE -->
  <script src="app.js"></script>
</body>
</html>
