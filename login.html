<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Reliable Jewellery Tools</title>
    <link rel="stylesheet" href="landing.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D4AF37">
    <meta name="description" content="Secure portal to access the Reliable Jewellery Professional Suite.">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 120px);
            padding: 20px;
            flex-grow: 1;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: var(--border-glass);
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-card);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(212, 175, 55, 0.2);
            transform: translateY(-2px);
        }

        .login-logo {
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-primary);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .login-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 10px;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-google {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 12px;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        .btn-google:active {
            transform: scale(0.98);
        }

        .error-message {
            margin-top: 20px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
            text-align: left;
            line-height: 1.4;
        }

        .loading-spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            border-top-color: var(--gold-primary);
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner-active .btn-google {
            display: none;
        }
        .spinner-active .loading-spinner {
            display: block;
        }
    </style>
</head>

<body>

    <!-- Ambient / Dynamic Background -->
    <div class="bg-container">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="floating-shape shape-diamond"></div>
        <div class="floating-shape shape-circle"></div>
        <div class="floating-shape shape-gem"></div>
    </div>

    <header>
        <h1>Reliable Jewellery</h1>
        <p class="subtitle">Secure Verification System</p>
    </header>

    <main class="login-container">
        <div class="login-card" id="login-card">
            <div class="login-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2>Protected Portal</h2>
            <p>Access is restricted to authorized personnel. Please authenticate using your registered Google account.</p>
            
            <div class="loading-spinner" id="spinner"></div>

            <button class="btn-google" id="login-btn">
                <!-- Google G Logo SVG -->
                <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </button>

            <div class="error-message" id="error-box"></div>
        </div>
    </main>

    <footer>
        &copy; 2026 Reliable Jewellery. Crafted for Excellence.
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase config initialization -->
    <script src="firebase-config.js"></script>

    <script>
        const loginBtn = document.getElementById('login-btn');
        const loginCard = document.getElementById('login-card');
        const errorBox = document.getElementById('error-box');

        // Extract redirect URL from query string
        const urlParams = new URLSearchParams(window.location.search);
        const redirectTarget = urlParams.get('redirect') || 'index.html';

        // Check if user is already signed in and approved
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                loginCard.classList.add('spinner-active');
                try {
                    const email = user.email.toLowerCase();
                    const doc = await db.collection('approved_users').doc(email).get();
                    if (doc.exists) {
                        // User is approved, go to landing page or original redirect url
                        window.location.href = redirectTarget;
                    } else {
                        // Signed in but not whitelisted
                        window.location.href = 'access-denied.html?email=' + encodeURIComponent(user.email);
                    }
                } catch (err) {
                    console.error("Verification error:", err);
                    loginCard.classList.remove('spinner-active');
                    showError("Unable to verify whitelist status. Please check your internet connection.");
                }
            }
        });

        loginBtn.addEventListener('click', async () => {
            loginCard.classList.add('spinner-active');
            errorBox.style.display = 'none';

            const provider = new firebase.auth.GoogleAuthProvider();
            // Optional: Request specific email profile scopes
            provider.addScope('email');

            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                const email = user.email.toLowerCase();

                // Check whitelist status
                const doc = await db.collection('approved_users').doc(email).get();

                if (doc.exists) {
                    window.location.href = redirectTarget;
                } else {
                    window.location.href = 'access-denied.html?email=' + encodeURIComponent(user.email);
                }
            } catch (err) {
                console.error("Login failed:", err);
                loginCard.classList.remove('spinner-active');
                
                if (err.code === 'auth/popup-blocked') {
                    showError("Sign-in popup was blocked by your browser. Please enable popups or try again.");
                } else if (err.code === 'auth/network-request-failed') {
                    showError("Network connection error. Please check your internet and try again.");
                } else {
                    showError("Authentication failed: " + err.message);
                }
            }
        });

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }
    </script>
</body>

</html>
