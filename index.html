<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Firebase Config & Auth Shield -->
    <script src="./firebase-config.js"></script>
    <script src="./auth-shield.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Reliable Jewellery Tools | Professional Suite</title>
    <link rel="stylesheet" href="landing.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D4AF37">
    <meta name="description"
        content="Reliable Jewellery Professional Suite: Accurate quotation calculations, diamond weight conversion, and rate convention tools for jewellery professionals.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Ambient Background -->
    <div class="bg-container">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="bg-orb orb-3"></div>
    </div>

    <!-- Full Page Wrapper -->
    <div class="page-wrapper">

        <header class="site-header">
            <div class="header-brand">
                <div class="brand-gem">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 3h12l4 6-10 13L2 9z"/>
                        <path d="M11 3 8 9l4 13 4-13-3-6"/>
                    </svg>
                </div>
                <span class="brand-name">Reliable Jewellery</span>
            </div>
            <p class="header-tagline">Professional Suite</p>
            <button id="logout-btn" class="logout-btn" title="Sign Out">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </header>

        <main class="app-grid">

            <!-- Card 1: Quotation -->
            <a href="quotation/index.html" class="card" id="card-quotation">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 3h12l4 6-10 13L2 9z"/>
                        <path d="M11 3 8 9l4 13 4-13-3-6"/>
                    </svg>
                </div>
                <span class="card-name">Quotation Rate</span>
            </a>

            <!-- Card 2: Price List -->
            <a href="price-list/index.html" class="card" id="card-pricelist">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        <line x1="9" y1="12" x2="15" y2="12"/>
                        <line x1="9" y1="16" x2="12" y2="16"/>
                    </svg>
                </div>
                <span class="card-name">Price List</span>
            </a>

            <!-- Card 3: Catalog -->
            <a href="catalog/index.html" class="card" id="card-catalog">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                        <line x1="7" y1="7" x2="7.01" y2="7"/>
                    </svg>
                </div>
                <span class="card-name">Catalog</span>
            </a>

            <!-- Card 4: Gold Purity Converter -->
            <a href="gold-converter/index.html" class="card" id="card-gold">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v18"/>
                        <path d="M5 10h14"/>
                        <path d="M5 21h14"/>
                        <path d="M17 10v4a2 2 0 1 1-4 0v-4"/>
                        <path d="M7 10v4a2 2 0 1 0 4 0v-4"/>
                    </svg>
                </div>
                <span class="card-name">Gold Purity Converter</span>
            </a>

            <!-- Card 5: Rate Conversion Tool -->
            <a href="tools/index.html" class="card" id="card-tools">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 3v18h18"/>
                        <path d="m19 9-5 5-4-4-3 3"/>
                    </svg>
                </div>
                <span class="card-name">Rate Conversion</span>
            </a>

            <!-- Card 6: Diamond Weight & Rate -->
            <a href="diamond/index.html" class="card" id="card-diamond">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2.7 10.3a2.41 2.41 0 0 0 0 3.41l7.59 7.59a2.41 2.41 0 0 0 3.41 0l7.59-7.59a2.41 2.41 0 0 0 0-3.41l-7.59-7.59a2.41 2.41 0 0 0-3.41 0Z"/>
                    </svg>
                </div>
                <span class="card-name">Diamond Weight &amp; Rate</span>
            </a>

            <!-- Card 7: Loss Calc -->
            <a href="loss/index.html" class="card" id="card-loss">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/>
                        <polyline points="17 18 23 18 23 12"/>
                    </svg>
                </div>
                <span class="card-name">Loss Calc</span>
            </a>

            <!-- Card 8: Narration -->
            <a href="NARRATION/index.html" class="card" id="card-narration">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                        <line x1="9" y1="12" x2="15" y2="12"/>
                        <line x1="9" y1="16" x2="12" y2="16"/>
                    </svg>
                </div>
                <span class="card-name">Narration</span>
            </a>

        </main>

    </div>

    <script>
        document.getElementById('logout-btn')?.addEventListener('click', () => {
            localStorage.removeItem('rj_user_approved');
            auth.signOut().then(() => window.location.reload());
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>

</body>

</html>
